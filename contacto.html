<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Realiza tu Pedido</title>
    <link rel="stylesheet" href="Estilos/contacto.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Mi<span> Pagina web</span></div>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="sobremi.html">Sobre mí</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main class="contenedor-pedido">
        <h1 class="titulo-principal">Realiza tu Pedido</h1>
        
        <div class="caja-formulario">
            <h2 class="titulo-formulario">Formulario de Contacto</h2>
            
            <form action="#" method="POST">
                <div class="grupo-input">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="grupo-input">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej. 987654321" required>
                </div>

                <div class="grupo-input">
                    <label for="direccion">Correo Electrónico:</label>
                    <input type="email" id="direccion" name="direccion" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="grupo-input">
                    <label for="pedido">Seleccione su pedido:</label>
                    <input list="opciones-pedido" id="pedido" name="pedido" placeholder="Escribe o selecciona un servicio" required>
                    <datalist id="opciones-pedido">
                        <option value="Modelado 3D"></option>
                        <option value="Arreglo de Computadoras"></option>
                        <option value="Desarrollar un sitio web"></option>
                    </datalist>
                </div>

                <div class="grupo-input">
                    <label for="cantidad">Cantidad de pedidos:</label>
                    <input type="number" id="cantidad" name="cantidad" min="1" value="1" required>
                </div>

                <div class="grupo-input">
                    <label for="observaciones">Observaciones:</label>
                    <textarea id="observaciones" name="observaciones" rows="3" placeholder="Detalles de lo que necesitas..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Pedido</button>
            </form>
        </div>
    </main>
 
    <footer class="footer">
        <p> 2026 - Josue Avendaño - Todos los derechos reservados.</p>
    </footer>

</body>
</html>
